; PlatformIO project for the E30 Rally CAN Gauge
;
; Board    : Teensy 4.0 (IMXRT1062, 600 MHz Cortex-M7)
; Displays : 3x ER-TFT2.79-1 (NV3007 controller, 142x428, 4-wire SPI, no MISO)
; Library  : lib/ILI9341_T4  -- vindar's ILI9341_T4 modified for the NV3007.
;            See lib/ILI9341_T4/PORTING_NV3007.md for every change made.
;
; Build with:   pio run
; Upload with:  pio run -t upload
; Monitor with: pio device monitor

; Two build targets ("environments"):
;   pio run                    -> main gauge firmware (default)
;   pio run -e display_test    -> the display bring-up test pattern
; build_src_filter selects which files under src/ each one compiles, so the
; two sketches (each with its own setup()/loop()) never collide.

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino

; USB serial for debug output
monitor_speed = 115200

; Main firmware: everything in src/ EXCEPT the examples folder.
build_src_filter = +<*> -<examples/>

; Libraries placed in lib/ are picked up automatically. FlexCAN_T4 and the
; Time library ship with the Teensy core. The DFPlayer Mini driver comes
; from the PlatformIO registry; teensy4_i2c (interrupt-driven, non-blocking
; I2C for the FM24V10 FRAM - see src/fram.h for why not Wire) from GitHub.
; tgx is vindar's 2D graphics library (same author as ILI9341_T4, designed
; to pair with it): it draws into our shared framebuffer with anti-aliased
; fonts and primitives - see src/gauge_render.cpp.
lib_deps =
    makuna/DFPlayer Mini Mp3 by Makuna @ ^1.2.3
    https://github.com/Richard-Gemmell/teensy4_i2c.git
    vindar/tgx @ ^1.1.4

[env:display_test]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200

; Only the display bring-up sketch.
build_src_filter = +<examples/display_bringup.cpp>
